<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holidays &amp; Events – Chabad of Carrollton-Lewisville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cal" class="cal">
  <div class="topbar"></div>

  <header class="head">
    <button class="nav prev" type="button" aria-label="Previous month">prev</button>
    <div class="title">
      <div class="month" id="monthName"></div>
      <div class="year" id="yearName"></div>
      <div class="hebmonth" id="hebMonth" dir="rtl"></div>
    </div>
    <button class="nav next" type="button" aria-label="Next month">next</button>
  </header>

  <div class="views" role="tablist">
    <button type="button" data-view="month" class="on">Month</button>
    <button type="button" data-view="list">List</button>
    <button type="button" class="today-btn">Today</button>
  </div>

  <section class="gridwrap" id="gridWrap">
    <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="filterbar" id="filterBar" hidden>
    <span id="filterLabel"></span>
    <button type="button" id="clearFilter">Show all upcoming</button>
  </div>

  <section class="list" id="list" aria-live="polite"></section>
  <button type="button" class="more" id="moreBtn" hidden>Show more events</button>

  <footer class="foot">
    <span>Zmanim for zip 75056 (as on Chabad.org) · candle lighting 18 min. before sunset</span>
    <span id="updated"></span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button type="button" class="close" aria-label="Close">×</button>
    <div id="mBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
