name: Update calendar

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may run it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build events.json from Google Calendar
        env:
          # Optional: the calendar's "Secret address in iCal format" (Settings → Secrets → Actions).
          # Leave unset if the calendar is public with full event details.
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
